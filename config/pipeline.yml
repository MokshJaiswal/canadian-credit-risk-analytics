# Every tunable number in the project lives here, with where it came from:
#   [brief]       verified in docs/PROJECT-BRIEF.md
#   [ASSUMPTION]  a labelled judgement call - fine to change, but never quote
#                 a result that depends on it as if it were a market fact
#
# Province codes are QUOTED on purpose: YAML reads a bare ON as true.

seed: 42  # same seed -> identical simulated loans every run

window:
  macro_start: "2015-01-01"        # rates fetched from here
  # Earliest loan signing date. Must be 10 years before renewal_window_start:
  # a 2025 renewal is either a 2020 signing (1st renewal) or a 2015 signing
  # (2nd renewal). Starting later leaves 2025 with half the renewals it should have.
  origination_start: "2015-01-01"
  performance_start: "2023-04-01"  # 42 months of loan performance,
  performance_end: "2026-09-30"    # matching the 42-month default targets [brief]
  renewal_window_start: "2025-01-01"  # the renewal wave we analyse [brief]
  renewal_window_end: "2027-12-31"
  # Rates after performance_end are unknown. We hold the last real month
  # flat - no forecasting. Shown on the dashboard as an assumption.
  future_rates: "flat"

sources:
  valet:
    series:  # verified Bank of Canada series IDs [brief]
      policy_rate: "V39079"
      prime_rate: "V80691311"
      goc_5yr_yield: "BD.CDN.5YR.DQ.YLD"
      posted_5yr_mortgage: "V80691335"  # POSTED sticker rate, not what people pay

  # Statistics Canada table 14-10-0287 (Labour force characteristics, monthly,
  # seasonally adjusted). A "coordinate" picks one series:
  # geography . characteristic . gender . age . statistic . data type
  statcan:
    url: "https://www150.statcan.gc.ca/t1/wds/rest/getDataFromCubePidCoordAndLatestNPeriods"
    product_id: 14100287
    geography_member:  # StatCan's member number for each province
      "CA": 1
      "NL": 2
      "PE": 3
      "NS": 4
      "NB": 5
      "QC": 6
      "ON": 7
      "MB": 8
      "SK": 9
      "AB": 10
      "BC": 11
    unemployment_rate_member: 7   # characteristic 7 = unemployment rate (%)
    population_member: 1          # characteristic 1 = population aged 15+ (thousands)

  # Canadian Bankers Association: residential mortgages 90+ days in arrears,
  # monthly since 1995, by region. The file name changes each month - update the
  # month in the URL when a newer file is published.
  cba_arrears:
    url: "https://cba.ca/Assets/CanadianBankersAssociation/Documents/Articles/Statistics/stat-mortgages-arrears-july-2026-en.xlsx"
    sheets:  # region name -> sheet in the Excel file
      "Canada": "CAN"
      "Atlantic": "AC"
      "Quebec": "QC"
      "Ontario": "ON"
      "Manitoba": "MB"
      "Saskatchewan": "SK"
      "Alberta": "AB"
      "British Columbia": "BC"
    province_region:  # CBA reports the four Atlantic provinces together
      "NL": "Atlantic"
      "PE": "Atlantic"
      "NS": "Atlantic"
      "NB": "Atlantic"
      "QC": "Quebec"
      "ON": "Ontario"
      "MB": "Manitoba"
      "SK": "Saskatchewan"
      "AB": "Alberta"
      "BC": "British Columbia"

portfolio:
  n_loans: 50000

  product_mix:  # share of loans by count; sums to 1.0 [ASSUMPTION]
    mortgage: 0.35
    heloc: 0.10
    auto: 0.20
    card: 0.35

  mortgage_fixed_share: 0.75  # the rest are variable [ASSUMPTION]

  # Province shares are no longer typed in here: notebook 01 computes them from
  # the REAL number of mortgages by region (CBA), splitting Atlantic Canada by
  # real population (StatCan). The same shares are used for every product. [ASSUMPTION]

  credit_score:  # normal distribution, clipped to 300-900 [ASSUMPTION]
    mean: 720
    sd: 70
    reference: 700  # score that gets the base rate; better scores pay less

  original_balance:  # uniform between min and max, CAD [ASSUMPTION]
    mortgage: [150000, 900000]
    heloc: [20000, 250000]
    auto: [15000, 70000]
    card: [500, 20000]

risk:
  mortgage:
    fixed_spread_over_goc_5yr: 1.40     # what people pay = GoC 5yr + 1.40pp [brief]
    variable_spread_over_prime: -1.00   # [ASSUMPTION]
    fixed_rate_floor: 1.35              # [brief]
    variable_rate_floor: 0.95           # [brief]
    score_sensitivity_per_100pts: 0.15  # pp cheaper per 100 points [brief]
    term_months: 60                     # 5-year term [brief]
    amortization_months: 300            # 25 years [brief]
    target_cum_default_42m: 0.005       # [brief]
    cure_rate: 0.50                     # [ASSUMPTION]
    lgd: 0.10                           # [ASSUMPTION]
  heloc:
    spread_over_prime: 0.50             # [ASSUMPTION]
    score_sensitivity_per_100pts: 0.25  # [ASSUMPTION]
    target_cum_default_42m: 0.008       # [brief]
    cure_rate: 0.45                     # [ASSUMPTION]
    lgd: 0.25                           # [ASSUMPTION]
  auto:
    spread_over_goc_5yr: 3.50           # [ASSUMPTION]
    score_sensitivity_per_100pts: 1.50  # [ASSUMPTION]
    term_months: 72                     # [ASSUMPTION]
    target_cum_default_42m: 0.03        # [brief]
    cure_rate: 0.40                     # [ASSUMPTION]
    lgd: 0.45                           # [ASSUMPTION]
  card:
    base_apr: 19.99                     # [ASSUMPTION]
    score_sensitivity_per_100pts: 5.5   # [brief]
    apr_range: [9.99, 29.99]            # [ASSUMPTION]
    target_cum_default_42m: 0.05        # [brief]
    cure_rate: 0.30                     # [ASSUMPTION]
    lgd: 0.85                           # [ASSUMPTION]

# What raises a loan's monthly chance of missing a payment
hazard_drivers:
  # Each 1pp rise in the loan's rate since signing raises the chance by 25%
  # (2pp -> x1.5). Rate DROPS don't push risk below the base. [ASSUMPTION]
  rate_increase_per_pp: 0.25
  # Every 100 points of credit score below the reference doubles the chance;
  # 100 points above halves it. [ASSUMPTION]
  score_points_to_double_risk: 100
  # Two REAL multipliers (notebook 02, data from src/fetch_provincial_data.py):
  #   WHERE = region's real 90+ arrears rate / Canada's   (CBA, calibrated)
  #   WHEN  = Canada's unemployment this month / its window average   (StatCan)
  # Real data showed unemployment tracks arrears over TIME (corr 0.69) but not
  # across REGIONS (corr -0.29), hence two separate factors. Risk proportional
  # to each factor is an [ASSUMPTION].

analysis:
  severe_payment_shock_pct: 25  # "At-Risk Exposure" cut-off [brief]
